; Optional: build with PlatformIO instead of a native ESP-IDF install (pio run / pio run -t upload).
; The project is a plain ESP-IDF project; idf.py build works the same from this folder.
[platformio]
src_dir = main

[env:bookmark]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
